name: Deploy Production

on:
  push:
    branches: [ main ]

jobs:
  deploy-production:
    name: Deploy to Production Cloud Run
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_PROD_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push API Image
        run: |
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROD_PROJECT_ID }}/vcps-repo/api:${{ github.sha }} -f apps/backend/Dockerfile .
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROD_PROJECT_ID }}/vcps-repo/api:${{ github.sha }}

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy vcps-api-prod \
            --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROD_PROJECT_ID }}/vcps-repo/api:${{ github.sha }} \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated
