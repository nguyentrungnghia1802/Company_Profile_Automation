name: Continuous Integration

on:
  push:
    branches: [main, chore/dev]
  pull_request:
    branches: [main, chore/dev]

jobs:
  backend-quality-and-tests:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Lint Python code (ruff check)
        run: uv run ruff check apps/backend/src apps/backend/tests

      - name: Check Python formatting (ruff format)
        run: uv run ruff format --check apps/backend/src apps/backend/tests

      - name: Typecheck Python code (mypy)
        run: uv run mypy apps/backend/src

      - name: Run unit tests (pytest)
        run: uv run pytest apps/backend/tests -m "not integration and not security and not e2e" -v

  governance-and-security:
    name: Governance & Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Check for secret leaks
        run: python scripts/check_secrets.py

      - name: Verify documentation and links
        run: python scripts/check_docs.py

      - name: Verify Requirement/Roadmap ID uniqueness
        run: python scripts/check_requirement_ids.py

      - name: Verify OpenAPI contract drift
        run: uv run python scripts/check_openapi_drift.py

  container-build:
    name: Container Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create safe .env file for build validation
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build backend container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          tags: vcps-backend:test
