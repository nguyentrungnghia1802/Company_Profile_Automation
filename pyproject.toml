[project]
name = "company-profile"
version = "0.1.0"
description = "Verified Company Profile System — evidence-first company intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.5.0,<3.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "alembic>=1.14.0,<2.0",
    "psycopg[binary]>=3.2.0,<4.0",
    "httpx>=0.27.0,<1.0",
    "pypdf>=5.0.0,<7.0.0",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    "email-validator>=2.3.0",
    "google-genai>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "coverage>=7.6.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "factory-boy>=3.3.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
vcps-api = "company_profile.api.app:create_app"
vcps-worker = "company_profile.worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/backend/src/company_profile"]

# --- Ruff ---
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/backend/src", "apps/backend/tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ANN",  # annotations
    "B",    # bugbear
    "A",    # builtins
    "COM",  # commas
    "C4",   # comprehensions
    "DTZ",  # datetime
    "T10",  # debugger
    "FA",   # future-annotations
    "ISC",  # implicit-str-concat
    "PIE",  # misc lints
    "PT",   # pytest
    "Q",    # quotes
    "RSE",  # raise
    "RET",  # return
    "SLF",  # self
    "SIM",  # simplify
    "TCH",  # type-checking
    "ARG",  # unused-arguments
    "PTH",  # pathlib
    "ERA",  # commented-out code
    "RUF",  # ruff-specific
]
ignore = [
    "ANN401",  # Any type
    "B008",    # function call in argument default (FastAPI Depends)
    "COM812",  # trailing comma (conflicts with formatter)
    "ISC001",  # implicit string concat (conflicts with formatter)
    "TC002",  # type-checking third-party imports
    "TC003",  # type-checking stdlib imports
]

[tool.ruff.lint.isort]
known-first-party = ["company_profile"]

# --- Mypy ---
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "apps/backend/src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["apps/backend/tests"]
pythonpath = ["apps/backend/src", "."]
asyncio_mode = "auto"
markers = [
    "unit: unit tests (no external dependencies)",
    "integration: requires database or external service",
    "security: security-focused tests",
    "e2e: end-to-end browser tests",
]

# --- Coverage ---
[tool.coverage.run]
source = ["company_profile"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ ==",
]
