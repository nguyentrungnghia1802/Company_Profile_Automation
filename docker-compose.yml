# Verified Company Profile System — Local Development Stack
# Usage: docker compose up --build

services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vcps
      POSTGRES_PASSWORD: vcps_dev
      POSTGRES_DB: vcps
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcps -d vcps"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- API Server ---
  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vcps:vcps_dev@postgres:5432/vcps
      ENVIRONMENT: development
      AUTH_MODE: mock
      AI_PROVIDER: mock
      SEARCH_PROVIDER: fixture
      OBJECT_STORAGE_PROVIDER: local
      TASK_DISPATCHER: postgres
      MALWARE_SCANNER_MODE: mock
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - storage_data:/app/data/storage
    restart: unless-stopped

  # --- Worker ---
  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["python", "-m", "company_profile.worker.main"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vcps:vcps_dev@postgres:5432/vcps
      ENVIRONMENT: development
      AUTH_MODE: mock
      AI_PROVIDER: mock
      SEARCH_PROVIDER: fixture
      OBJECT_STORAGE_PROVIDER: local
      TASK_DISPATCHER: postgres
      MALWARE_SCANNER_MODE: mock
      WORKER_ID: worker-local-1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - storage_data:/app/data/storage
    restart: unless-stopped

  # --- Web (Next.js) ---
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  storage_data:
