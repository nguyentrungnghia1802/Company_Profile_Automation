# Verified Company Profile System — Local Development Stack
# Usage: docker compose up --build

services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vcps
      POSTGRES_PASSWORD: vcps_dev
      POSTGRES_DB: vcps
    ports:
      # The container network always uses postgres:5432. Keep the host port
      # configurable so another local PostgreSQL instance cannot block startup.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcps -d vcps"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Local schema and mock-auth bootstrap ---
  # This service creates the current development schema and memberships only.
  # Production deployments must run the explicit Alembic migration workflow.
  db-bootstrap:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["python", "-m", "company_profile.operations.local_bootstrap"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vcps:vcps_dev@postgres:5432/vcps
      ENVIRONMENT: development
      AUTH_MODE: mock
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # --- API Server ---
  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vcps:vcps_dev@postgres:5432/vcps
      ENVIRONMENT: development
      AUTH_MODE: mock
      # Defaults are disabled; .env may explicitly opt into real providers.
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-disabled}
      OBJECT_STORAGE_PROVIDER: local
      TASK_DISPATCHER: postgres
      MALWARE_SCANNER_MODE: mock
    depends_on:
      postgres:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    volumes:
      - storage_data:/app/data/storage
    restart: unless-stopped

  # --- Worker ---
  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["python", "-m", "company_profile.worker.main"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vcps:vcps_dev@postgres:5432/vcps
      ENVIRONMENT: development
      AUTH_MODE: mock
      # Defaults are disabled; fixtures remain rejected outside test environments.
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-disabled}
      OBJECT_STORAGE_PROVIDER: local
      TASK_DISPATCHER: postgres
      MALWARE_SCANNER_MODE: mock
      WORKER_ID: worker-local-1
    depends_on:
      postgres:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    volumes:
      - storage_data:/app/data/storage
    # The backend image's default probe targets the API port; the worker has no
    # HTTP server, so use a process liveness probe instead.
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # --- Web (Next.js) ---
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        API_PROXY_TARGET: http://api:8000
        NEXT_PUBLIC_MOCK_AUTH_TOKEN: ${NEXT_PUBLIC_MOCK_AUTH_TOKEN:-mock-token-researcher}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_MOCK_AUTH_TOKEN: ${NEXT_PUBLIC_MOCK_AUTH_TOKEN:-mock-token-researcher}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  storage_data:
